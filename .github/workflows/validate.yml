name: Validate shell tools

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for file in menu.sh scripts/**/*.sh tools/*.sh; do
            bash -n "$file"
          done

      - name: Check sourced helpers presence
        shell: bash
        run: |
          set -euo pipefail
          helpers="$(sed -nE 's/^readonly EXTRA_FILES=\((.*)\)$/\1/p' menu.sh | tr -d '"')"
          [[ -n "$helpers" ]] || {
            echo "menu.sh 中未声明 EXTRA_FILES"
            exit 1
          }
          echo "声明附属文件：$helpers"
          for file in scripts/*/*/*.sh; do
            dir="$(dirname "$file")"
            for helper in $helpers; do
              [[ "$file" == *"/$helper" ]] && continue
              if grep -q "$helper" "$file"; then
                [[ -f "$dir/$helper" ]] || {
                  echo "$file references $helper but $dir/$helper is missing"
                  exit 1
                }
              fi
            done
          done

      - name: Check catalog field count
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [[ -z "${line//[[:space:]]/}" || "$line" == \#* ]] && continue
            count="$(awk -F'|' '{print NF}' <<<"$line")"
            [[ "$count" -eq 12 ]] || {
              echo "catalog row has $count fields, expected 12: $line"
              exit 1
            }
          done < catalog.tsv

      - name: Check with shellcheck
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck 未安装，跳过"
            exit 0
          fi
          shellcheck --severity=error --shell=bash menu.sh tests/run-tests.sh scripts/*/*/*.sh tools/*.sh

      - name: Run tests
        shell: bash
        run: bash tests/run-tests.sh

      - name: Check catalog references
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r profile_id _family _version os_path _title \
            script_id file _script_title _description _risk _root _mode; do
            [[ -z "${profile_id//[[:space:]]/}" || "$profile_id" == \#* ]] && continue
            [[ -f "scripts/$os_path/$file" ]] || {
              echo "catalog.tsv references missing file: scripts/$os_path/$file"
              exit 1
            }
          done < catalog.tsv

      - name: Check parameter runner coverage
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r profile_id _family _version os_path _title \
            script_id file _script_title _description _risk _root _mode; do
            [[ -z "${profile_id//[[:space:]]/}" || "$profile_id" == \#* ]] && continue
            runner="scripts/$os_path/run.sh"
            [[ -f "$runner" ]] || {
              echo "missing parameter runner: $runner"
              exit 1
            }
            bash "$runner" --describe "$file" >/dev/null || {
              echo "$runner cannot describe $file"
              exit 1
            }
          done < catalog.tsv

      - name: Verify checksums
        shell: bash
        run: sha256sum --check --strict SHA256SUMS

  e2e-debconf:
    # 在真实 Ubuntu 24.04 里验证 apt 不会弹出 debconf 选择界面。
    # 用 script 造 pty：没有终端时 debconf 本来就不弹框，那样测试是假通过。
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install without prompts
        run: |
          docker run --rm -i -v "$PWD":/w -w /w ubuntu:24.04 bash -c '
            set -e
            apt-get update -qq
            script -qec "bash tests/e2e-debconf.sh" /dev/null'
