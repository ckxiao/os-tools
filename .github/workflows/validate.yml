name: Validate shell tools

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for file in menu.sh scripts/**/*.sh; do
            bash -n "$file"
          done

      - name: Check shared library presence
        shell: bash
        run: |
          set -euo pipefail
          for file in scripts/*/*/*.sh; do
            if grep -q 'common\.sh' "$file"; then
              dir="$(dirname "$file")"
              [[ -f "$dir/common.sh" ]] || {
                echo "$file references common.sh but $dir/common.sh is missing"
                exit 1
              }
            fi
          done

      - name: Check catalog field count
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r line; do
            [[ -z "${line//[[:space:]]/}" || "$line" == \#* ]] && continue
            count="$(awk -F'|' '{print NF}' <<<"$line")"
            [[ "$count" -eq 12 ]] || {
              echo "catalog row has $count fields, expected 12: $line"
              exit 1
            }
          done < catalog.tsv

      - name: Check with shellcheck
        shell: bash
        run: |
          if ! command -v shellcheck >/dev/null 2>&1; then
            echo "shellcheck 未安装，跳过"
            exit 0
          fi
          shellcheck --severity=error --shell=bash menu.sh scripts/*/*/*.sh

      - name: Check catalog references
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r profile_id _family _version os_path _title \
            script_id file _script_title _description _risk _root _mode; do
            [[ -z "${profile_id//[[:space:]]/}" || "$profile_id" == \#* ]] && continue
            [[ -f "scripts/$os_path/$file" ]] || {
              echo "catalog.tsv references missing file: scripts/$os_path/$file"
              exit 1
            }
          done < catalog.tsv

      - name: Check parameter runner coverage
        shell: bash
        run: |
          set -euo pipefail
          while IFS='|' read -r profile_id _family _version os_path _title \
            script_id file _script_title _description _risk _root _mode; do
            [[ -z "${profile_id//[[:space:]]/}" || "$profile_id" == \#* ]] && continue
            runner="scripts/$os_path/run.sh"
            [[ -f "$runner" ]] || {
              echo "missing parameter runner: $runner"
              exit 1
            }
            bash "$runner" --describe "$file" >/dev/null || {
              echo "$runner cannot describe $file"
              exit 1
            }
          done < catalog.tsv

      - name: Verify checksums
        shell: bash
        run: sha256sum --check --strict SHA256SUMS
